name: assign-reviewer-review-capture

# Runs this repository's own capture action when a review is submitted. It
# is the unprivileged half of the review update, and only uploads an
# artifact for assign-reviewer-review-apply.
#
# The checkout names the default branch, so the action comes from there and
# not from the PR. pull_request_review still runs the PR's own copy of this
# file, so a fork can change what runs here. That gains no privileges (the
# token stays read-only), and the apply side treats the artifact as
# untrusted.
#
# The name above is referenced by the workflow_run filter in
# assign_reviewer_review_apply.yaml, so the two must change together.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            capture
            lib
      - uses: ./capture
