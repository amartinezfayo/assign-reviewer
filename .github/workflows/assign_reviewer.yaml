name: assign-reviewer

# Runs this repository's own assign action on its pull requests. See the
# README for the rules.
#
# Unlike a repository that opts in (see examples/), this workflow does not
# pin the action to a commit. It checks out the default branch and runs the
# action from there, so the repository always exercises its latest code and
# a regression shows up here before another project picks it up.
#
# The pull_request_target events carry a write-scoped token even for PRs from
# forks, and issue_comment also runs from the default branch with a
# write-scoped token. This is safe because the checkout names the default
# branch, so no code from the PR is ever fetched or run.

on:
  pull_request_target:
    types: [opened, ready_for_review, review_requested, synchronize]
  issue_comment:
    types: [created]

# Each event action gets its own group so the "opened" run is not cancelled
# by the burst of CODEOWNERS "review_requested" events that fires with it.
# issue_comment events carry an issue payload instead of a pull_request one,
# hence the number fallback.
concurrency:
  group: assign-reviewer-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}-${{ github.event.action }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # check out the action, read .github/reviewer-pool.json
      issues: write        # add/remove assignees (the issues API endpoint)
      pull-requests: write # add/remove assignees on the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            assign
            lib
      - uses: ./assign
